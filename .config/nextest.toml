# A test running past `period * terminate-after` is killed, so a hung test
# cannot stall a run (or CI) forever.
[profile.default]
retries = 0
slow-timeout = { period = "60s", terminate-after = 3 }

[profile.ci]
retries = 2
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 3 }

[profile.ci.junit]
path = "junit.xml"
