[workspace]
resolver = "3"
members = ["crates/*"]

# Shared package metadata — member crates inherit with `field.workspace = true`.
[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Arkptz/agent-slop"
authors = ["arkptz <arkptz@gmail.com>"]
description = "Deterministic linter for AI-agent comment slop with hook ratchets"
keywords = ["lint", "comments", "ai", "agents", "ast-grep"]
categories = ["development-tools", "command-line-utilities"]

# Single place for cross-crate dependency versions. Members reference these with
# `dep.workspace = true` so the whole workspace stays on one version.
[workspace.dependencies]
agent-slop-core = { path = "crates/agent-slop-core", version = "=1.0.0" }
agent-slop-integrations = { path = "crates/agent-slop-integrations", version = "=1.0.0" }
agent-slop-protocol = { path = "crates/agent-slop-protocol", version = "1" }
# The ast-grep API changes between minor releases; bumps are deliberate.
ast-grep-core = "=0.45.3"
ast-grep-language = "=0.45.3"
blake3 = "1"
home = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unicode-normalization = "0.1"

# Workspace-wide lints — inherited by each crate via `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
