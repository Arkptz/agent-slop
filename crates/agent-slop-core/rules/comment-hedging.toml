# slop/comment-hedging — a comment that hedges instead of committing:
# "should work", "might not be the best approach", "hopefully". The code
# ships; the comment expressing doubt about shipped code is either a
# hidden defect (make it a TODO with a condition) or noise (delete it).
[meta]
id = "comment-hedging"
severity = "warning"

[match]
phrases = [
  "should work",
  "should be fine",
  "should be okay",
  "should be enough",
  "might not be the best",
  "might not be ideal",
  "may not be the best",
  "may not be ideal",
  "hopefully",
  "not sure if",
  "not sure this",
  "not sure why",
  "not sure about",
  "i'm not sure",
  "im not sure",
  "probably works",
  "probably fine",
  "probably not the best",
  "probably right",
  "best guess",
  "i think this works",
  "this may need",
  "this might need",
  "this could need",
  "seems to work",
  "seems correct",
  "seems right",
  "казаться должно работать",
  "вроде работает",
  "вроде правильно",
  "вроде как работает",
  "наверное работает",
  "наверное правильно",
  "скорее всего работает",
  "должно работать",
  "должно быть достаточно",
  "может быть не лучшим",
  "не уверен",
  "не уверена",
  "не уверен, что",
  "не точно",
  "возможно придётся",
  "возможно придется",
  "возможно понадобится",
  "похоже, что работает",
  "похоже работает",
  "как кажется",
  "как кажется правильным",
]
word_boundaries = true

[exception]
shape = "A question addressed to a specific human in a doc-comment on a stub awaiting their answer ('@owner: does the 4096 cap still hold?') — the doubt is the content and it has a recipient."

[note]
text = "Either commit or make the doubt actionable: state the fact you verified, or write 'TODO(owner): verify X before Y' so the condition can expire. 'Should work' does neither."
